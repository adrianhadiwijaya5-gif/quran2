<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarteel AI Pro v3.8 - Madani Adaptive Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/kfgqpc-uthman-taha-naskh-standard" rel="stylesheet">
    
    <style>
        .font-quran-madani { 
            font-family: 'KFGQPC Uthman Taha Naskh Standard', 'Noto Sans Arabic', serif; 
            font-size: 2.5rem; 
            line-height: 5.8rem; 
            word-spacing: 6px;
        }
        .font-sans-custom { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* STATE MENGHILANG TOTAL (TRUE INVISIBLE) */
        .state-hidden { 
            color: transparent !important; 
            text-shadow: 0 0 40px rgba(255,255,255,0);
            background: transparent; 
            user-select: none;
            transition: all 0.3s ease;
        }
        
        /* KETIKA SUARA PAS, AYAT MUNCUL BERTAHAP */
        .state-correct { 
            color: #10b981 !important; 
            opacity: 1 !important; 
            font-weight: 700; 
            background: transparent;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        } 
        .state-done { color: #e2e8f0 !important; opacity: 1 !important; background: transparent; transition: all 0.3s ease; }
        .state-standby { color: #334155; opacity: 0.15; transition: all 0.3s ease; }
        .state-focus { color: #475569; opacity: 0.35; background: rgba(51, 65, 85, 0.2); border-radius: 8px; }

        .quran-ayah-frame {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 46px;         
            height: 46px;
            margin: 0 14px;      
            vertical-align: middle;
            transition: all 0.3s ease;
        }
        .quran-frame-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            fill: none;
            stroke: #334155;
            stroke-width: 1.5;
        }
        .mushaf-scroll::-webkit-scrollbar { width: 6px; }
        .mushaf-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .mushaf-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans-custom min-h-screen antialiased">

    <nav class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-50 shadow-xl">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-br from-emerald-600 to-teal-700 p-2 rounded-xl text-white shadow-md">
                    <i class="fa-solid fa-book-quran text-base"></i>
                </div>
                <div>
                    <span class="font-bold text-sm tracking-wide bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">TARTEEL CORE v3.8</span>
                    <p class="text-[9px] text-slate-500 font-mono tracking-wider">ADAPTIVE MULTI-AYAH SCANNER ENGINE</p>
                </div>
            </div>
            <div class="text-[9px] bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800 flex items-center gap-1.5 font-mono uppercase text-emerald-400">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                Tracking Bug Fixed
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-4 space-y-4">
        
        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl space-y-4">
            <div>
                <span class="text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-2 font-mono">Mode Menghafal Interaktif:</span>
                <div class="grid grid-cols-3 gap-2">
                    <button id="btnModeRead" onclick="gantiModeAplikasi('read')" class="bg-slate-950 border border-slate-800 text-slate-400 p-3 rounded-xl cursor-pointer text-left transition hover:bg-slate-800">
                        <div class="flex justify-between items-center"><span class="text-xs font-bold">1. Melihat Teks</span><i class="fa-solid fa-eye text-xs"></i></div>
                    </button>
                    <button id="btnModeHide" onclick="gantiModeAplikasi('hide')" class="bg-emerald-600 border border-emerald-500 text-white p-3 rounded-xl cursor-pointer text-left transition shadow-lg">
                        <div class="flex justify-between items-center"><span class="text-xs font-bold">2. Ayat Menghilang</span><i class="fa-solid fa-eye-slash text-xs"></i></div>
                    </button>
                    <button id="btnModeQuiz" onclick="gantiModeAplikasi('quiz')" class="bg-slate-950 border border-slate-800 text-slate-400 p-3 rounded-xl cursor-pointer text-left transition hover:bg-slate-800">
                        <div class="flex justify-between items-center"><span class="text-xs font-bold">3. Mode Quiz</span><i class="fa-solid fa-graduation-cap text-xs"></i></div>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-center border-t border-slate-800/60 pt-3">
                <div>
                    <label class="text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-1 font-mono">Pilih Nomor Surah (1-114)</label>
                    <div class="flex gap-1.5">
                        <input type="number" id="inpLinkAyat" value="108" min="1" max="114" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-center font-bold font-mono text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                        <button onclick="loadSurahTarteel()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-4 rounded-xl text-xs transition">Load</button>
                    </div>
                </div>

                <div class="text-center">
                    <span class="text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-1 font-mono">Kontrol Engine Suara</span>
                    <button id="btnTarteelVoice" onclick="toggleTarteelVoiceEngine()" class="w-full bg-slate-800 text-slate-200 py-2 rounded-xl text-xs font-bold border border-slate-700 cursor-pointer transition hover:bg-slate-700 flex justify-center items-center gap-2">
                        <i id="iconVoiceEngine" class="fa-solid fa-microphone text-emerald-400"></i> <span id="txtVoiceEngine">Mulai Rekam Suara</span>
                    </button>
                </div>

                <div id="quizPromptBox" class="bg-amber-950/20 border border-amber-900/40 p-2.5 rounded-xl hidden text-left">
                    <span class="text-[9px] font-bold uppercase tracking-wider text-amber-400 font-mono block">Tantangan Quiz:</span>
                    <p id="txtQuizPrompt" class="text-xs font-bold text-slate-300 mt-0.5">Memilih target ayat...</p>
                </div>
            </div>
        </div>

        <div id="monitorSuaraBox" class="hidden bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
            <span class="text-[9px] uppercase font-mono tracking-wider text-emerald-400 font-bold"><i class="fa-solid fa-wave-square mr-1 animate-pulse"></i> Mic Capture:</span>
            <p id="txtLiveAudioSpeech" class="font-quran-madani text-right text-base text-amber-300 truncate max-w-xl" dir="rtl">Mendengarkan...</p>
        </div>

        <div class="bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl overflow-hidden flex flex-col">
            <div id="mushafAreaContainer" class="p-6 md:p-12 h-[55vh] overflow-y-auto text-right select-none mushaf-scroll bg-slate-950/20" dir="rtl">
                <div id="mushafParagraphContent" class="font-quran-madani text-justify whitespace-normal leading-[5.8rem]"></div>
            </div>
        </div>
    </main>

    <script>
        const frameNomorAyatMelingkarSVG = `
            <svg class="quran-frame-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="38" stroke="#334155" stroke-width="1.8" fill="none"/>
                <circle cx="50" cy="50" r="31" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
                <circle cx="50" cy="7" r="2.5" fill="#475569"/>
                <circle cx="50" cy="93" r="2.5" fill="#475569"/>
            </svg>
        `;

        function buatOrnamenHeaderSurahHTML(namaInggris, namaArab, totalAyat) {
            return `
                <div class="w-full my-6 block text-center select-none" dir="ltr">
                    <div class="inline-block relative w-full max-w-md p-4 rounded-2xl border border-slate-800 bg-gradient-to-b from-slate-950 to-slate-900 shadow-xl">
                        <span class="text-[9px] font-mono tracking-widest text-emerald-400 uppercase font-bold block mb-0.5">سُورَةُ</span>
                        <h2 class="text-xl font-bold font-sans text-slate-200 tracking-wide">${namaInggris}</h2>
                        <p class="text-xl font-quran-madani text-slate-400 my-1" dir="rtl">${namaArab}</p>
                    </div>
                    <div class="w-full text-center my-6 block font-quran-madani text-slate-100/90 text-2xl" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
                </div>
            `;
        }

        let dataAyatSurahAktif = [];
        let speechEngine;
        let isEngineMendengar = false;
        let indexAyatFokusTracker = 0;
        let modeAktifApp = "hide"; 
        let targetQuizAyatSaja = null;

        window.onload = () => { loadSurahTarteel(); };

        function gantiModeAplikasi(modeBaru) {
            modeAktifApp = modeBaru;
            ["Read", "Hide", "Quiz"].forEach(m => {
                document.getElementById(`btnMode${m}`).className = "bg-slate-950 border border-slate-800 text-slate-400 p-3 rounded-xl cursor-pointer text-left transition hover:bg-slate-800";
            });
            const namaIdKapital = modeBaru.charAt(0).toUpperCase() + modeBaru.slice(1);
            document.getElementById(`btnMode${namaIdKapital}`).className = "bg-emerald-600 border border-emerald-500 text-white p-3 rounded-xl cursor-pointer text-left transition shadow-lg";
            if(speechEngine) speechEngine.stop();
            refreshRenderingTampilanAyat();
        }

        async function loadSurahTarteel() {
            let surahNum = parseInt(document.getElementById('inpLinkAyat').value.trim()) || 108;
            const container = document.getElementById('mushafParagraphContent');
            container.innerHTML = `<div class="text-center py-16 w-full font-mono text-xs text-slate-500">MENGUNDUH MUSHAF MADANI...</div>`;
            
            dataAyatSurahAktif = [];
            indexAyatFokusTracker = 0;

            try {
                const resText = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/editions/quran-simple`);
                const jsonText = await resText.json();

                if (jsonText.code === 200) {
                    let metadataSurah = jsonText.data[0];
                    metadataSurah.ayahs.forEach((ayah) => {
                        let rawText = ayah.text;
                        if(ayah.numberInSurah === 1 && surahNum !== 1 && surahNum !== 9 && rawText.startsWith("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ")) {
                            rawText = rawText.replace("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ", "");
                        }

                        let penandaSpesial = null;
                        if(ayah.juz && ayah.numberInSurah === 1) penandaSpesial = `JUZ ${ayah.juz}`;
                        if(surahNum === 18 && ayah.numberInSurah === 1) penandaSpesial = "SAKTAH";

                        dataAyatSurahAktif.push({
                            nomor: ayah.numberInSurah,
                            namaSurahInggris: metadataSurah.englishName,
                            namaSurahArab: metadataSurah.name,
                            totalAyatGlobal: metadataSurah.ayahs.length,
                            teksAsli: rawText.replace(/[\u064B-\u0652]/g, "").trim(), // Bersihkan harakat untuk verifikasi kata dasar mic
                            teksTampil: rawText,
                            fiturKhusus: penandaSpesial
                        });
                    });

                    if(isEngineMendengar && speechEngine) speechEngine.stop();
                    refreshRenderingTampilanAyat();
                }
            } catch (err) {
                container.innerHTML = `<div class="text-center py-12 text-red-400 text-xs">Gagal memuat API.</div>`;
            }
        }

        function refreshRenderingTampilanAyat() {
            const container = document.getElementById('mushafParagraphContent');
            if(dataAyatSurahAktif.length === 0) return;
            
            container.innerHTML = "";
            let htmlBuilder = buatOrnamenHeaderSurahHTML(dataAyatSurahAktif[0].namaSurahInggris, dataAyatSurahAktif[0].namaSurahArab, dataAyatSurahAktif[0].totalAyatGlobal);

            if(modeAktifApp === "quiz") {
                let acakIndex = Math.floor(Math.random() * dataAyatSurahAktif.length);
                targetQuizAyatSaja = dataAyatSurahAktif[acakIndex];
                document.getElementById('quizPromptBox').classList.remove('hidden');
                document.getElementById('txtQuizPrompt').innerText = `Lafalkan ayat ke-${targetQuizAyatSaja.nomor}!`;

                dataAyatSurahAktif.forEach(ayah => {
                    let isTargetQuiz = (ayah.nomor === targetQuizAyatSaja.nomor);
                    htmlBuilder += `
                        <span id="target-arab-${ayah.nomor}" class="${isTargetQuiz ? 'state-hidden' : 'state-done'} inline">${ayah.teksTampil}</span>
                        <span id="frame-box-${ayah.nomor}" class="quran-ayah-frame ${isTargetQuiz ? 'opacity-20' : ''}">${frameNomorAyatMelingkarSVG}<span class="absolute font-sans text-[10px] font-bold text-slate-400 z-10">${ayah.nomor}</span></span>
                    `;
                });
            } else if(modeAktifApp === "hide") {
                // MODE MENGHILANG TOTAL DI AWAL SESI
                dataAyatSurahAktif.forEach((ayah) => {
                    let badgeLabelSpesial = ayah.fiturKhusus ? `<span id="badge-khusus-${ayah.nomor}" class="bg-indigo-600/30 text-indigo-300 font-mono text-[9px] px-1.5 py-0.5 rounded mx-1 invisible">${ayah.fiturKhusus}</span>` : "";
                    htmlBuilder += `
                        <span id="target-arab-${ayah.nomor}" class="state-hidden inline">${ayah.teksTampil}</span>
                        ${badgeLabelSpesial}
                        <span id="frame-box-${ayah.nomor}" class="quran-ayah-frame opacity-0">${frameNomorAyatMelingkarSVG}<span class="absolute font-sans text-[10px] font-bold text-slate-400 z-10">${ayah.nomor}</span></span>
                    `;
                });
            } else {
                dataAyatSurahAktif.forEach((ayah, i) => {
                    let classAwal = (i === 0) ? "state-focus" : "state-standby";
                    htmlBuilder += `
                        <span id="target-arab-${ayah.nomor}" class="${classAwal} inline">${ayah.teksTampil}</span>
                        <span id="frame-box-${ayah.nomor}" class="quran-ayah-frame opacity-100">${frameNomorAyatMelingkarSVG}<span class="absolute font-sans text-[10px] font-bold text-slate-400 z-10">${ayah.nomor}</span></span>
                    `;
                });
            }

            container.innerHTML += htmlBuilder;
        }

        // --- UPDATE UTAMA: ENGINE ADAPTIF DETEKSI LOMPATAN AYAT ---
        function prosessorAnalisisRealtimeAI(suaraInput) {
            let teksUserClean = suaraInput.trim().replace(/[\u064B-\u0652]/g, "");
            let kataUserArr = teksUserClean.split(' ');

            if(modeAktifApp === "quiz") {
                eksekusiKoreksiAyatTunggal(targetQuizAyatSaja, kataUserArr);
            } else {
                // Pindai jendela rentang ayat (Ayat Sekarang s/d 3 Ayat di depannya)
                let batasAtasScan = Math.min(indexAyatFokusTracker + 3, dataAyatSurahAktif.length);
                
                for (let i = indexAyatFokusTracker; i < batasAtasScan; i++) {
                    let ayatPindaan = dataAyatSurahAktif[i];
                    let kataTargetArr = ayatPindaan.teksAsli.split(' ');
                    
                    let cocok = 0;
                    kataUserArr.slice(-7).forEach(k => { if(kataTargetArr.includes(k)) cocok++; });
                    let rasioAkurasi = cocok / kataTargetArr.length;

                    // Jika suara user cocok dengan salah satu ayat di rentang scan, aktifkan ayat tersebut!
                    if (rasioAkurasi >= 0.45) {
                        tampilkanAyatSukses(ayatPindaan);
                        
                        // Set index tracker langsung melompat ke ayat paling ujung yang dibaca user
                        indexAyatFokusTracker = i + 1; 
                        break; 
                    }
                }
            }
        }

        function eksekusiKoreksiAyatTunggal(ayat, kataUserArr) {
            let kataTargetArr = ayat.teksAsli.split(' ');
            let cocok = 0;
            kataUserArr.slice(-7).forEach(k => { if(kataTargetArr.includes(k)) cocok++; });
            if ((cocok / kataTargetArr.length) >= 0.45) {
                tampilkanAyatSukses(ayat);
                speechEngine.stop();
            }
        }

        function tampilkanAyatSukses(ayah) {
            const targetEl = document.getElementById(`target-arab-${ayah.nomor}`);
            const frameEl = document.getElementById(`frame-box-${ayah.nomor}`);
            const badgeEl = document.getElementById('badge-khusus-' + ayah.nomor);

            if(targetEl) targetEl.className = "state-correct inline";
            if(frameEl) frameEl.className = "quran-ayah-frame opacity-100";
            if(badgeEl) badgeEl.classList.remove('invisible');

            // Gulung otomatis layar agar teks yang dibaca berada di pandangan user
            if(targetEl) targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // --- AUDIO CAPTURE CONTROLLER ---
        function toggleTarteelVoiceEngine() {
            if (dataAyatSurahAktif.length === 0) return alert("Muat surah terlebih dahulu!");

            if (!speechEngine) {
                const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
                speechEngine = new SpeechClass();
                speechEngine.lang = 'ar-SA';
                speechEngine.continuous = true;
                speechEngine.interimResults = true;

                speechEngine.onstart = () => {
                    isEngineMendengar = true;
                    document.getElementById('btnTarteelVoice').className = "w-full bg-red-600 text-white py-2 rounded-xl text-xs font-bold border border-red-500 animate-pulse";
                    document.getElementById('txtVoiceEngine').innerText = "Hentikan Perekaman";
                    document.getElementById('monitorSuaraBox').classList.remove('hidden');
                };

                speechEngine.onend = () => {
                    isEngineMendengar = false;
                    document.getElementById('btnTarteelVoice').className = "w-full bg-slate-800 text-slate-200 py-2 rounded-xl text-xs font-bold border border-slate-700";
                    document.getElementById('txtVoiceEngine').innerText = "Mulai Rekam Suara";
                    document.getElementById('monitorSuaraBox').classList.add('hidden');
                };

                speechEngine.onresult = (event) => {
                    let textResult = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        textResult += event.results[i][0].transcript;
                    }
                    document.getElementById('txtLiveAudioSpeech').innerText = textResult;
                    if(textResult.trim() !== "") prosessorAnalisisRealtimeAI(textResult.trim());
                };
            }

            if(isEngineMendengar) speechEngine.stop(); else { refreshRenderingTampilanAyat(); indexAyatFokusTracker = 0; speechEngine.start(); }
        }
    </script>
</body>
</html>
