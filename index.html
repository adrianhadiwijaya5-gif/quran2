<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tarteel Engine - Continuous Mushaf</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Font Al-Qur'an Standar Mushaf */
        .font-mushaf { 
            font-family: 'Amiri Quran', serif; 
            font-size: 2.5rem; 
            line-height: 5.5rem; 
            word-spacing: 4px;
        }
        .font-sans-custom { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* State Efek Tarteel: Ayat Tersembunyi/Samar di Awal */
        .status-standby { filter: blur(7px); opacity: 0.08; transition: all 0.5s ease; }
        .status-focus { filter: blur(0px) !important; opacity: 0.4 !important; color: #64748b !important; }
        
        /* State 3 Warna Koreksi */
        .status-correct { color: #10b981 !important; filter: blur(0px) !important; opacity: 1 !important; font-weight: bold; } /* Hijau */
        .status-warning { color: #f97316 !important; filter: blur(0px) !important; opacity: 1 !important; } /* Oranye */
        .status-wrong { color: #ef4444 !important; filter: blur(0px) !important; opacity: 1 !important; font-weight: bold; } /* Merah */
        
        /* Lingkaran Nomor Ayat Khas Mushaf */
        .mushaf-ayah-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            margin: 0 12px;
            transform: translateY(-4px);
            vertical-align: middle;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body id="bodyApp" class="bg-slate-950 text-slate-100 font-sans-custom min-h-screen antialiased transition-colors duration-300">

    <nav id="navApp" class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-xl transition-colors duration-300">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 p-2 rounded-xl text-white shadow-lg shadow-emerald-950/50">
                    <i class="fa-solid fa-microphone-lines text-base"></i>
                </div>
                <div>
                    <span class="font-bold text-sm tracking-wide bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">TARTEEL VERTICAL ENGINE</span>
                    <p class="text-[9px] text-slate-500 font-mono tracking-wider">CONTINUOUS TEXT PAGE Layout</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="toggleTemaLayar()" id="btnThemeToggle" class="bg-slate-800 hover:bg-slate-700 text-amber-400 p-2 rounded-xl border border-slate-700 cursor-pointer w-9 h-9 flex items-center justify-center transition shadow-inner">
                    <i id="iconTheme" class="fa-solid fa-moon"></i>
                </button>
                <div id="statusBadge" class="text-xs bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800 flex items-center gap-1.5 font-mono text-[9px] uppercase tracking-wider text-slate-400">
                    <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    Ready
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-4 space-y-4">
        
        <div id="panelKontrol" class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-col md:flex-row gap-4 items-center justify-between transition-colors">
            <div class="w-full md:w-1/3">
                <label id="lblInput" class="text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-1 font-mono">Nomor Surah (1-114)</label>
                <div class="flex gap-1.5">
                    <input type="text" id="inpLinkAyat" placeholder="Contoh: 95 untuk At-Tin" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-center font-bold font-mono text-xs text-slate-100 focus:outline-none focus:border-emerald-500 placeholder-slate-700 transition-colors">
                    <button onclick="loadSurahTarteel()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 rounded-xl text-xs transition cursor-pointer shadow-md">
                        Muat
                    </button>
                </div>
            </div>

            <div class="w-full md:w-1/3 text-center">
                <span id="lblVoice" class="text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-1 font-mono">Kontrol Engine</span>
                <button id="btnTarteelVoice" onclick="toggleTarteelVoiceEngine()" class="w-full bg-slate-800 text-slate-200 hover:text-white py-2 rounded-xl text-xs font-bold cursor-pointer transition hover:bg-slate-700 border border-slate-700 flex justify-center items-center gap-2">
                    <i id="iconVoiceEngine" class="fa-solid fa-play text-emerald-400 text-[10px]"></i> <span id="txtVoiceEngine">Mulai Mode Membaca</span>
                </button>
            </div>

            <div id="boxParameter" class="bg-slate-950 p-2 rounded-xl border border-slate-900 flex justify-around w-full md:w-1/3 text-center text-[9px] font-mono transition-colors">
                <div><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block mr-1"></span><span id="pAman" class="text-slate-400">Hijau</span></div>
                <div><span class="w-1.5 h-1.5 rounded-full bg-orange-500 inline-block mr-1"></span><span id="pToleransi" class="text-slate-400">Oranye</span></div>
                <div><span class="w-1.5 h-1.5 rounded-full bg-red-500 inline-block mr-1"></span><span id="pSalah" class="text-slate-400">Merah</span></div>
            </div>
        </div>

        <div id="monitorSuaraBox" class="hidden bg-emerald-950/20 border border-emerald-900/40 p-3 rounded-xl flex items-center justify-between">
            <span class="text-[9px] uppercase font-mono tracking-wider text-emerald-400 font-bold"><i class="fa-solid fa-microphone mr-1 animate-pulse"></i> Suara Terdeteksi:</span>
            <p id="txtLiveAudioSpeech" class="font-mushaf text-right text-sm text-amber-200/90 truncate max-w-lg" dir="rtl">Menunggu hafalan...</p>
        </div>

        <div id="mushafCard" class="bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl overflow-hidden transition-colors">
            <div id="mushafHeader" class="p-4 bg-slate-900 border-b border-slate-800 text-center transition-colors">
                <h2 id="txtNamaSurah" class="font-bold text-xs uppercase tracking-widest text-slate-400 font-mono">MUSHAF MAJU VERTIKAL</h2>
            </div>

            <div id="mushafAreaContainer" class="p-8 md:p-12 min-h-[50vh] max-h-[75vh] overflow-y-auto text-right select-none" dir="rtl">
                <div id="mushafPlaceholder" class="text-center py-20 text-slate-600 space-y-2" dir="ltr">
                    <i class="fa-solid fa-book-open text-4xl text-slate-800"></i>
                    <p class="text-xs max-w-xs mx-auto">Ketik nomor surah lalu klik **Muat**. Ayat akan menyatu vertikal ke bawah tanpa kotak pembatas.</p>
                </div>
                
                <div id="mushafParagraphContent" class="font-mushaf hidden text-justify whitespace-normal tracking-wide"></div>
            </div>
        </div>
    </main>

    <script>
        let dataAyatSurahAktif = [];
        let speechEngine;
        let isEngineMendengar = false;
        let indexAyatFokusTracker = 0;
        let modeLayarGelap = true;

        // --- DUAL-THEME LAYOUT SWITCHER ---
        function toggleTemaLayar() {
            modeLayarGelap = !modeLayarGelap;
            
            const body = document.getElementById('bodyApp');
            const nav = document.getElementById('navApp');
            const panel = document.getElementById('panelKontrol');
            const boxParam = document.getElementById('boxParameter');
            const statusBdg = document.getElementById('statusBadge');
            const cardMushaf = document.getElementById('mushafCard');
            const headerMushaf = document.getElementById('mushafHeader');
            const iconTheme = document.getElementById('iconTheme');
            const btnToggle = document.getElementById('btnThemeToggle');
            const inputField = document.getElementById('inpLinkAyat');

            if (!modeLayarGelap) {
                // TEMA TERANG (Light Mode) - Seperti kertas Al-Qur'an fisik putih/krem bersih
                body.className = "bg-slate-100 text-slate-900 font-sans-custom min-h-screen antialiased transition-colors duration-300";
                nav.className = "bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm transition-colors duration-300";
                panel.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow grid grid-cols-1 md:grid-cols-3 gap-4 items-center transition-colors";
                boxParam.className = "bg-slate-50 p-2 rounded-xl border border-slate-200 flex justify-around text-center transition-colors";
                statusBdg.className = "text-[9px] bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200 flex items-center gap-1.5 transition-colors";
                cardMushaf.className = "bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden transition-colors";
                headerMushaf.className = "p-4 bg-slate-50 border-b border-slate-200 text-center transition-colors";
                inputField.className = "w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-center font-bold font-mono text-xs text-slate-800 focus:outline-none focus:border-emerald-500 placeholder-slate-400 transition-colors";
                btnToggle.className = "bg-slate-100 hover:bg-slate-200 text-indigo-600 p-2 rounded-xl border border-slate-200 cursor-pointer w-9 h-9 flex items-center justify-center transition shadow-inner";
                iconTheme.className = "fa-solid fa-sun";

                document.getElementById('lblInput').className = "text-[9px] font-bold uppercase tracking-wider text-slate-400 block mb-1 font-mono";
                document.getElementById('lblVoice').className = "text-[9px] font-bold uppercase tracking-wider text-slate-400 block mb-1 font-mono";
                document.getElementById('pAman').className = "text-slate-500"; document.getElementById('pToleransi').className = "text-slate-500"; document.getElementById('pSalah').className = "text-slate-500";
            } else {
                // TEMA GELAP (Dark Mode)
                body.className = "bg-slate-950 text-slate-100 font-sans-custom min-h-screen antialiased transition-colors duration-300";
                nav.className = "bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-xl transition-colors duration-300";
                panel.className = "bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-2xl grid grid-cols-1 md:grid-cols-3 gap-4 items-center transition-colors";
                boxParam.className = "bg-slate-950 p-2 rounded-xl border border-slate-900 flex justify-around text-center transition-colors";
                statusBdg.className = "text-[9px] bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800 flex items-center gap-1.5 transition-colors";
                cardMushaf.className = "bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl overflow-hidden transition-colors";
                headerMushaf.className = "p-4 bg-slate-900 border-b border-slate-800 text-center transition-colors";
                inputField.className = "w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-center font-bold font-mono text-xs text-slate-100 focus:outline-none focus:border-emerald-500 placeholder-slate-700 transition-colors";
                btnToggle.className = "bg-slate-800 hover:bg-slate-700 text-amber-400 p-2 rounded-xl border border-slate-700 cursor-pointer w-9 h-9 flex items-center justify-center transition shadow-inner";
                iconTheme.className = "fa-solid fa-moon";

                document.getElementById('lblInput').className = "text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-1 font-mono";
                document.getElementById('lblVoice').className = "text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-1 font-mono";
                document.getElementById('pAman').className = "text-slate-400"; document.getElementById('pToleransi').className = "text-slate-400"; document.getElementById('pSalah').className = "text-slate-400";
            }
            refreshBadgeStyles();
        }

        function refreshBadgeStyles() {
            dataAyatSurahAktif.forEach(item => {
                const bdg = document.getElementById(`badge-num-${item.nomor}`);
                if (bdg && !bdg.hasAttribute('data-colored')) {
                    bdg.style.backgroundColor = modeLayarGelap ? "#020617" : "#f1f5f9";
                    bdg.style.color = modeLayarGelap ? "#94a3b8" : "#475569";
                    bdg.style.borderColor = modeLayarGelap ? "#334155" : "#cbd5e1";
                }
            });
        }

        // --- RENDERING PARAGRAF KONTINU (SEPERTI IMAGE_7EF1B5.PNG) ---
        async function loadSurahTarteel() {
            const input = document.getElementById('inpLinkAyat').value.trim();
            if(!input) return;

            let surahNum = parseInt(input);
            if(isNaN(surahNum) || surahNum < 1 || surahNum > 114) {
                alert("Masukkan nomor surah yang valid (1-114)!");
                return;
            }

            const placeholder = document.getElementById('mushafPlaceholder');
            const textContainer = document.getElementById('mushafParagraphContent');
            
            placeholder.innerHTML = `
                <div class="text-center py-12 text-slate-500">
                    <i class="fa-solid fa-rotate text-xl animate-spin text-emerald-500 mb-2"></i>
                    <p class="text-xs font-mono">Mentransmisikan teks Quran kontinu...</p>
                </div>`;
            placeholder.classList.remove('hidden');
            textContainer.classList.add('hidden');

            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/editions/quran-simple`);
                const json = await res.json();

                if(json.code === 200) {
                    document.getElementById('txtNamaSurah').innerText = `${json.data[0].englishName} (${json.data[0].name})`;
                    placeholder.classList.add('hidden');
                    textContainer.classList.remove('hidden');
                    
                    textContainer.innerHTML = ""; // Reset isi teks sebelumnya
                    dataAyatSurahAktif = [];

                    // Jika bukan Al-Fatihah atau At-Taubah, bisa ditambahkan penanda Bismillah di atas textContainer jika diperlukan
                    let fullHTMLString = "";

                    json.data[0].ayahs.forEach((ayah, idx) => {
                        let textArabClean = ayah.text;
                        const nomorAyat = ayah.numberInSurah;

                        if(nomorAyat === 1 && surahNum !== 1 && surahNum !== 9 && textArabClean.startsWith("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ")) {
                            textArabClean = textArabClean.replace("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ", "");
                            // Tampilkan Bismillah sebagai pembuka blok kontinu di baris tersendiri
                            fullHTMLString += `<div class="text-center w-full block mb-6 text-slate-400 font-mushaf">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
                        }

                        dataAyatSurahAktif.push({
                            nomor: nomorAyat,
                            teksAsli: textArabClean.replace(/[\u064B-\u0652]/g, ""), 
                            teksTampil: textArabClean
                        });

                        // Setiap ayat dibungkus span agar menyatu mengalir secara vertikal & horizontal tanpa ganti baris paksa
                        fullHTMLString += `
                            <span id="target-arab-${nomorAyat}" class="status-standby inline">
                                ${textArabClean}
                            </span>
                            <span id="badge-num-${nomorAyat}" class="mushaf-ayah-badge border">
                                ${nomorAyat}
                            </span>
                        `;
                    });

                    textContainer.innerHTML = fullHTMLString;
                    indexAyatFokusTracker = 0;
                    refreshBadgeStyles();
                }
            } catch (err) {
                placeholder.innerHTML = `<p class="text-center text-xs text-red-400">Gagal memuat database cloud.</p>`;
            }
        }

        // --- ENGINE AUDIO SPEECH RECOGNITION ---
        function toggleTarteelVoiceEngine() {
            if (dataAyatSurahAktif.length === 0) {
                alert("Muat surah terlebih dahulu!");
                return;
            }

            const btn = document.getElementById('btnTarteelVoice');
            const icon = document.getElementById('iconVoiceEngine');
            const txt = document.getElementById('txtVoiceEngine');
            const monitor = document.getElementById('monitorSuaraBox');

            if (!speechEngine) {
                const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
                speechEngine = new SpeechClass();
                speechEngine.lang = 'ar-SA';
                speechEngine.continuous = true;
                speechEngine.interimResults = true;

                speechEngine.onstart = () => {
                    isEngineMendengar = true;
                    btn.className = "w-full bg-emerald-700 text-white py-2 rounded-xl text-xs font-bold cursor-pointer border border-emerald-500 animate-pulse";
                    icon.className = "fa-solid fa-stop text-[10px]";
                    txt.innerText = "Berhenti & Evaluasi";
                    monitor.classList.remove('hidden');
                    
                    bukaKunciAyatAktif(dataAyatSurahAktif[indexAyatFokusTracker].nomor);
                };

                speechEngine.onend = () => {
                    isEngineMendengar = false;
                    btn.className = "w-full bg-slate-800 text-slate-200 py-2 rounded-xl text-xs font-bold cursor-pointer border border-slate-700";
                    icon.className = "fa-solid fa-play text-emerald-400 text-[10px]";
                    txt.innerText = "Mulai Mode Membaca";
                    monitor.classList.add('hidden');
                };

                speechEngine.onresult = (event) => {
                    let interimTranscript = '';
                    let finalTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }

                    const hasilSuaraText = finalTranscript || interimTranscript;
                    document.getElementById('txtLiveAudioSpeech').innerText = hasilSuaraText;

                    if(hasilSuaraText.trim() !== "") {
                        prosesEvaluasiTarteelAI(hasilSuaraText);
                    }
                };
            }

            if (isEngineMendengar) {
                speechEngine.stop();
            } else {
                resetSemuaWarnaTarteel();
                indexAyatFokusTracker = 0;
                speechEngine.start();
            }
        }

        function resetSemuaWarnaTarteel() {
            dataAyatSurahAktif.forEach(item => {
                const el = document.getElementById(`target-arab-${item.nomor}`);
                if(el) el.className = "status-standby inline";
                const bdg = document.getElementById(`badge-num-${item.nomor}`);
                if(bdg) {
                    bdg.removeAttribute('data-colored');
                    bdg.style.borderWidth = "1px";
                }
            });
            refreshBadgeStyles();
        }

        function bukaKunciAyatAktif(noAyat) {
            const el = document.getElementById(`target-arab-${noAyat}`);
            if(el) {
                el.className = "status-focus inline";
                // Menggulung layar secara halus tepat ke kata yang sedang dibaca agar tetap berada di tengah layar
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // Logic String Matcher 3 Warna Real-Time
        function prosesEvaluasiTarteelAI(suaraUser) {
            if(indexAyatFokusTracker >= dataAyatSurahAktif.length) return;

            let ayatTarget = dataAyatSurahAktif[indexAyatFokusTracker];
            let teksBersihSuara = suaraUser.trim().replace(/[\u064B-\u0652]/g, "");

            let skorKemiripan = hitungKemiripanTeks(teksBersihSuara, ayatTarget.teksAsli);

            const targetEl = document.getElementById(`target-arab-${ayatTarget.nomor}`);
            const badgeNomor = document.getElementById(`badge-num-${ayatTarget.nomor}`);

            if (skorKemiripan >= 0.80) { 
                // HIJAU
                targetEl.className = "status-correct inline";
                warnaiBadgeBulat(badgeNomor, "#10b981");
                majuKeAyatBerikutnya();
            } else if (skorKemiripan >= 0.45 && skorKemiripan < 0.80) {
                // ORANYE
                targetEl.className = "status-warning inline";
                warnaiBadgeBulat(badgeNomor, "#f97316");
                majuKeAyatBerikutnya();
            } else {
                // MERAH
                targetEl.className = "status-wrong inline";
                warnaiBadgeBulat(badgeNomor, "#ef4444");
            }
        }

        function warnaiBadgeBulat(el, warnaHex) {
            if(!el) return;
            el.setAttribute('data-colored', 'true');
            el.style.backgroundColor = warnaHex;
            el.style.color = "#ffffff";
            el.style.borderColor = warnaHex;
            el.style.borderWidth = "2px";
        }

        function majuKeAyatBerikutnya() {
            indexAyatFokusTracker++;
            if(indexAyatFokusTracker < dataAyatSurahAktif.length) {
                bukaKunciAyatAktif(dataAyatSurahAktif[indexAyatFokusTracker].nomor);
            } else {
                alert("Alhamdulillah, seluruh surah selesai dibaca!");
                if(speechEngine) speechEngine.stop();
            }
        }

        function hitungKemiripanTeks(str1, str2) {
            let s1 = str1.split(' '); let s2 = str2.split(' ');
            let cocok = 0;
            s1.forEach(kata => { if(s2.includes(kata)) cocok++; });
            return (2.0 * cocok) / (s1.length + s2.length);
        }
    </script>
</body>
</html>
