<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Corrector AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .font-mushaf { 
            font-family: 'Amiri Quran', serif; 
            font-size: 2.75rem; 
            line-height: 6rem; 
            word-spacing: 6px;
        }
        .font-sans-custom { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* STATE MODE TARTEEL MURNI (HILANG -> MUNCUL -> HILANG) */
        /* 1. Standby: Benar-benar disembunyikan total dari layar (Anti-Nyontek) */
        .status-standby { display: none !important; opacity: 0; filter: blur(4px); transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* 2. Focus: Muncul samar-samar saat giliran ayatnya dibaca */
        .status-focus { display: inline !important; opacity: 0.25 !important; filter: blur(0px) !important; color: #94a3b8 !important; }
        
        /* 3. Correct: Menyala Hijau terang saat diucapkan */
        .status-correct { display: inline !important; color: #10b981 !important; filter: blur(0px) !important; opacity: 1 !important; font-weight: bold; } 
        .status-warning { display: inline !important; color: #f97316 !important; filter: blur(0px) !important; opacity: 1 !important; } 
        .status-wrong { display: inline !important; color: #ef4444 !important; filter: blur(0px) !important; opacity: 1 !important; font-weight: bold; } 

        /* 4. Done/Fade Out: Setelah selesai dievaluasi, langsung memudar hilang ke background */
        .status-done { display: inline !important; opacity: 0 !important; filter: blur(10px) !important; transition: all 0.8s ease; pointer-events: none; }

        /* Container nomor ayat dengan SVG Custom Bingkai */
        .mushaf-frame-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 56px;
            height: 56px;
            margin: 0 8px;
            transform: translateY(-2px);
            vertical-align: middle;
        }
        .mushaf-frame-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            fill: none;
            stroke: #475569;
            stroke-width: 1.2;
            transition: all 0.4s ease;
        }
        .mushaf-frame-number {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            z-index: 10;
        }
    </style>
</head>
<body id="bodyApp" class="bg-slate-950 text-slate-100 font-sans-custom min-h-screen antialiased transition-colors duration-300">

    <nav id="navApp" class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-xl transition-colors duration-300">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 p-2 rounded-xl text-white shadow-lg shadow-emerald-950/50">
                    <i class="fa-solid fa-eye-slash text-base"></i>
                </div>
                <div>
                    <span class="font-bold text-sm tracking-wide bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">TARTEEL VISUAL FADE ENGINE</span>
                    <p class="text-[9px] text-slate-500 font-mono tracking-wider">CUSTOM FRAME & AUTO-HIDE MODE</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="toggleTemaLayar()" id="btnThemeToggle" class="bg-slate-800 hover:bg-slate-700 text-amber-400 p-2 rounded-xl border border-slate-700 cursor-pointer w-9 h-9 flex items-center justify-center transition shadow-inner">
                    <i id="iconTheme" class="fa-solid fa-moon"></i>
                </button>
                <div id="statusBadge" class="text-xs bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800 flex items-center gap-1.5 font-mono text-[9px] uppercase tracking-wider text-slate-400">
                    <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    Ready
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-4 space-y-4">
        
        <div id="panelKontrol" class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-xl flex flex-col md:flex-row gap-4 items-center justify-between transition-colors">
            <div class="w-full md:w-1/3">
                <label id="lblInput" class="text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-1 font-mono">Nomor Surah (1-114)</label>
                <div class="flex gap-1.5">
                    <input type="text" id="inpLinkAyat" placeholder="Contoh: 95, 108, 1" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-center font-bold font-mono text-xs text-slate-100 focus:outline-none focus:border-emerald-500 placeholder-slate-700 transition-colors">
                    <button onclick="loadSurahTarteel()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 rounded-xl text-xs transition cursor-pointer shadow-md">
                        Muat
                    </button>
                </div>
            </div>

            <div class="w-full md:w-1/3 text-center">
                <span id="lblVoice" class="text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-1 font-mono">Mode Membaca Otomatis</span>
                <button id="btnTarteelVoice" onclick="toggleTarteelVoiceEngine()" class="w-full bg-slate-800 text-slate-200 hover:text-white py-2 rounded-xl text-xs font-bold cursor-pointer transition hover:bg-slate-700 border border-slate-700 flex justify-center items-center gap-2">
                    <i id="iconVoiceEngine" class="fa-solid fa-play text-emerald-400 text-[10px]"></i> <span id="txtVoiceEngine">Mulai Hafalan</span>
                </button>
            </div>

            <div id="boxParameter" class="bg-slate-950 p-2 rounded-xl border border-slate-900 flex justify-around w-full md:w-1/3 text-center text-[9px] font-mono transition-colors">
                <div class="text-slate-400"><i class="fa-solid fa-wand-magic-sparkles text-emerald-400 mr-1"></i> Ayat Selesai = Otomatis Hilang</div>
            </div>
        </div>

        <div id="monitorSuaraBox" class="hidden bg-emerald-950/20 border border-emerald-900/40 p-3 rounded-xl flex items-center justify-between">
            <span class="text-[9px] uppercase font-mono tracking-wider text-emerald-400 font-bold"><i class="fa-solid fa-microphone mr-1 animate-pulse"></i> Deteksi:</span>
            <p id="txtLiveAudioSpeech" class="font-mushaf text-right text-sm text-amber-200/90 truncate max-w-lg" dir="rtl">Mendengarkan...</p>
        </div>

        <div id="mushafCard" class="bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl overflow-hidden transition-colors">
            <div id="mushafHeader" class="p-4 bg-slate-900 border-b border-slate-800 text-center transition-colors">
                <h2 id="txtNamaSurah" class="font-bold text-xs uppercase tracking-widest text-slate-400 font-mono">MUSHAF TARTEEL INDEPENDEN</h2>
            </div>

            <div id="mushafAreaContainer" class="p-8 md:p-12 min-h-[50vh] max-h-[75vh] overflow-y-auto text-right select-none" dir="rtl">
                <div id="mushafPlaceholder" class="text-center py-20 text-slate-600 space-y-2" dir="ltr">
                    <i class="fa-solid fa-wand-magic-sparkles text-4xl text-slate-800"></i>
                    <p class="text-xs max-w-xs mx-auto">Teks ayat disembunyikan secara bawaan. Mulai membaca, maka ayat tujuan akan muncul sekilas lalu memudar hilang setelah dibaca!</p>
                </div>
                
                <div id="mushafParagraphContent" class="font-mushaf hidden text-justify whitespace-normal tracking-wide"></div>
            </div>
        </div>
    </main>

    <script>
        // --- LOCAL DATABANK FALLBACK (Mengatasi Eror Cloud Server) ---
        const localSurahDatabase = {
            1: {
                name: "الفاتحة", englishName: "Al-Fatihah",
                ayahs: [
                    { numberInSurah: 1, text: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ" },
                    { numberInSurah: 2, text: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ" },
                    { numberInSurah: 3, text: "الرَّحْمَٰنِ الرَّحِيمِ" },
                    { numberInSurah: 4, text: "مَالِكِ يَوْمِ الدِّينِ" },
                    { numberInSurah: 5, text: "إِيَّاكَ نَعْبُدُ Free وَإِيَّاكَ نَسْتَعِينُ" },
                    { numberInSurah: 6, text: "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ" },
                    { numberInSurah: 7, text: "صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ" }
                ]
            },
            108: {
                name: "الكوثر", englishName: "Al-Kautsar",
                ayahs: [
                    { numberInSurah: 1, text: "إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ" },
                    { numberInSurah: 2, text: "فَصَلِّ لِرَبِّكَ وَانْحَرْ" },
                    { numberInSurah: 3, text: "إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ" }
                ]
            },
            112: {
                name: "الإخلاص", englishName: "Al-Ikhlas",
                ayahs: [
                    { numberInSurah: 1, text: "قُلْ هُوَ اللَّهُ أَحَدٌ" },
                    { numberInSurah: 2, text: "اللَّهُ الصَّمَدُ" },
                    { numberInSurah: 3, text: "لَمْ يَلِدْ وَلَمْ يُولَدْ" },
                    { numberInSurah: 4, text: "وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ" }
                ]
            }
        };

        let dataAyatSurahAktif = [];
        let speechEngine;
        let isEngineMendengar = false;
        let indexAyatFokusTracker = 0;
        let modeLayarGelap = true;
        let timestampEvaluasiTerakhir = 0;

        // Path SVG Bingkai Ornamen Khas dari Sketsa File Gambar User
        const svgMushafFrameHTML = `
            <svg class="mushaf-frame-svg" viewBox="0 0 100 100">
                <path d="M 50,4 C 24,4 4,24 4,50 C 4,76 24,96 50,96 C 76,96 96,76 96,50 C 96,24 76,4 50,4 Z"/>
                <path d="M 50,10 C 35,15 15,35 10,50 C 15,65 35,85 50,90 C 65,85 85,65 90,50 C 85,35 65,15 50,10 Z" stroke-dasharray="2,2"/>
                <circle cx="50" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1"/>
                <circle cx="50" cy="92" r="3" fill="none" stroke="currentColor" stroke-width="1"/>
            </svg>
        `;

        // --- THEME ---
        function toggleTemaLayar() {
            modeLayarGelap = !modeLayarGelap;
            const body = document.getElementById('bodyApp');
            const nav = document.getElementById('navApp');
            const panel = document.getElementById('panelKontrol');
            const cardMushaf = document.getElementById('mushafCard');
            const headerMushaf = document.getElementById('mushafHeader');
            const iconTheme = document.getElementById('iconTheme');
            const btnToggle = document.getElementById('btnThemeToggle');
            const inputField = document.getElementById('inpLinkAyat');

            if (!modeLayarGelap) {
                body.className = "bg-slate-100 text-slate-900 font-sans-custom min-h-screen antialiased transition-colors duration-300";
                nav.className = "bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm transition-colors duration-300";
                panel.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow grid grid-cols-1 md:grid-cols-3 gap-4 items-center transition-colors";
                cardMushaf.className = "bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden transition-colors";
                headerMushaf.className = "p-4 bg-slate-50 border-b border-slate-200 text-center transition-colors";
                inputField.className = "w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-center font-bold font-mono text-xs text-slate-800 focus:outline-none focus:border-emerald-500 placeholder-slate-400";
                btnToggle.className = "bg-slate-100 hover:bg-slate-200 text-indigo-600 p-2 rounded-xl border border-slate-200 cursor-pointer w-9 h-9 flex items-center justify-center transition";
                iconTheme.className = "fa-solid fa-sun";
            } else {
                body.className = "bg-slate-950 text-slate-100 font-sans-custom min-h-screen antialiased transition-colors duration-300";
                nav.className = "bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-xl transition-colors duration-300";
                panel.className = "bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-2xl grid grid-cols-1 md:grid-cols-3 gap-4 items-center transition-colors";
                cardMushaf.className = "bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl overflow-hidden transition-colors";
                headerMushaf.className = "p-4 bg-slate-900 border-b border-slate-800 text-center transition-colors";
                inputField.className = "w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-center font-bold font-mono text-xs text-slate-100 focus:outline-none focus:border-emerald-500 placeholder-slate-700";
                btnToggle.className = "bg-slate-800 hover:bg-slate-700 text-amber-400 p-2 rounded-xl border border-slate-700 cursor-pointer w-9 h-9 flex items-center justify-center transition";
                iconTheme.className = "fa-solid fa-moon";
            }
            refreshFrameStyles();
        }

        function refreshFrameStyles() {
            dataAyatSurahAktif.forEach(item => {
                const svgPath = document.querySelector(`#frame-box-${item.nomor} .mushaf-frame-svg`);
                const numTxt = document.querySelector(`#frame-box-${item.nomor} .mushaf-frame-number`);
                if (svgPath && !svgPath.hasAttribute('data-colored')) {
                    svgPath.style.stroke = modeLayarGelap ? "#475569" : "#cbd5e1";
                    numTxt.style.color = modeLayarGelap ? "#94a3b8" : "#475569";
                }
            });
        }

        // --- MUSHAF RENDERER ---
        async function loadSurahTarteel() {
            const input = document.getElementById('inpLinkAyat').value.trim();
            if(!input) return;

            let surahNum = parseInt(input);
            const placeholder = document.getElementById('mushafPlaceholder');
            const textContainer = document.getElementById('mushafParagraphContent');
            
            placeholder.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-rotate text-xl animate-spin text-emerald-500 mb-2"></i><p class="text-xs font-mono">Menghubungkan Transmisi...</p></div>`;
            placeholder.classList.remove('hidden');
            textContainer.classList.add('hidden');

            let surahData;
            try {
                // Tarik data cloud dengan batasan timeout aman
                const controller = new AbortController();
                setTimeout(() => controller.abort(), 4000);
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/editions/quran-simple`, { signal: controller.signal });
                const json = await res.json();
                if(json.code === 200) surahData = json.data[0];
            } catch (err) {
                // Jika Eror/Offline (Image 1), otomatis ambil dari Local Database agar tidak crash
                if (localSurDatabase[surahNum]) {
                    surahData = localSurahDatabase[surahNum];
                }
            }

            if(surahData) {
                document.getElementById('txtNamaSurah').innerText = `${surahData.englishName} (${surahData.name})`;
                placeholder.classList.add('hidden');
                textContainer.classList.remove('hidden');
                
                textContainer.innerHTML = ""; 
                dataAyatSurahAktif = [];
                let fullHTMLString = "";

                surahData.ayahs.forEach((ayah) => {
                    let textArabClean = ayah.text;
                    const nomorAyat = ayah.numberInSurah;

                    if(nomorAyat === 1 && surahNum !== 1 && surahNum !== 9 && textArabClean.startsWith("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ")) {
                        textArabClean = textArabClean.replace("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ", "");
                        fullHTMLString += `<div class="text-center w-full block mb-6 text-slate-500 font-mushaf">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
                    }

                    dataAyatSurahAktif.push({
                        nomor: nomorAyat,
                        teksAsli: textArabClean.replace(/[\u064B-\u0652]/g, "").trim(),
                        teksTampil: textArabClean
                    });

                    // Susun Ayat dengan mode bawaan HILANG (status-standby) dan SVG Frame Ornamen baru
                    fullHTMLString += `
                        <span id="target-arab-${nomorAyat}" class="status-standby inline">
                            ${textArabClean}
                        </span>
                        <span id="frame-box-${nomorAyat}" class="mushaf-frame-container">
                            ${svgMushafFrameHTML}
                            <span class="mushaf-frame-number">${nomorAyat}</span>
                        </span>
                    `;
                });

                textContainer.innerHTML = fullHTMLString;
                indexAyatFokusTracker = 0;
                refreshFrameStyles();
            } else {
                placeholder.innerHTML = `<p class="text-center text-xs text-red-400 p-4 bg-red-950/20 border border-red-900 rounded-xl">Gagal memuat surah. Masukkan nomor 1, 108, atau 112 untuk mode offline tanpa server cloud.</p>`;
            }
        }

        // --- SPEECH RECOGNITION CORE ENGINE ---
        function toggleTarteelVoiceEngine() {
            if (dataAyatSurahAktif.length === 0) {
                alert("Muat surah terlebih dahulu!");
                return;
            }

            const btn = document.getElementById('btnTarteelVoice');
            const icon = document.getElementById('iconVoiceEngine');
            const txt = document.getElementById('txtVoiceEngine');
            const monitor = document.getElementById('monitorSuaraBox');

            if (!speechEngine) {
                const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
                speechEngine = new SpeechClass();
                speechEngine.lang = 'ar-SA';
                speechEngine.continuous = true;
                speechEngine.interimResults = true;

                speechEngine.onstart = () => {
                    isEngineMendengar = true;
                    btn.className = "w-full bg-emerald-700 text-white py-2 rounded-xl text-xs font-bold border border-emerald-500 animate-pulse cursor-pointer";
                    icon.className = "fa-solid fa-stop text-[10px]";
                    txt.innerText = "Selesai Hafalan";
                    monitor.classList.remove('hidden');
                    
                    bukaKunciAyatAktif(dataAyatSurahAktif[indexAyatFokusTracker].nomor);
                };

                speechEngine.onend = () => {
                    isEngineMendengar = false;
                    btn.className = "w-full bg-slate-800 text-slate-200 py-2 rounded-xl text-xs font-bold border border-slate-700 cursor-pointer";
                    icon.className = "fa-solid fa-play text-emerald-400 text-[10px]";
                    txt.innerText = "Mulai Hafalan";
                    monitor.classList.add('hidden');
                };

                speechEngine.onresult = (event) => {
                    let interimTranscript = '';
                    let finalTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }

                    const hasilSuaraText = (finalTranscript || interimTranscript).trim();
                    document.getElementById('txtLiveAudioSpeech').innerText = hasilSuaraText;

                    if(hasilSuaraText !== "") {
                        prosesEvaluasiTarteelAI(hasilSuaraText);
                    }
                };
            }

            if (isEngineMendengar) {
                speechEngine.stop();
            } else {
                resetSemuaWarnaTarteel();
                indexAyatFokusTracker = 0;
                timestampEvaluasiTerakhir = 0;
                speechEngine.start();
            }
        }

        function resetSemuaWarnaTarteel() {
            dataAyatSurahAktif.forEach(item => {
                const el = document.getElementById(`target-arab-${item.nomor}`);
                if(el) el.className = "status-standby inline";
                const svgPath = document.querySelector(`#frame-box-${item.nomor} .mushaf-frame-svg`);
                if(svgPath) {
                    svgPath.removeAttribute('data-colored');
                    svgPath.style.strokeWidth = "1.2";
                }
            });
            refreshFrameStyles();
        }

        function bukaKunciAyatAktif(noAyat) {
            const el = document.getElementById(`target-arab-${noAyat}`);
            if(el) {
                // Tampilkan samar-samar sebagai panduan membaca ayat aktif saat ini
                el.className = "status-focus inline";
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // --- EVALUASI DAN AUTO-HIDE LOGIC ---
        function prosesEvaluasiTarteelAI(suaraUser) {
            if(indexAyatFokusTracker >= dataAyatSurahAktif.length) return;

            let waktuSekarang = Date.now();
            if (waktuSekarang - timestampEvaluasiTerakhir < 600) return;

            let ayatTarget = dataAyatSurahAktif[indexAyatFokusTracker];
            let teksBersihSuara = suaraUser.trim().replace(/[\u064B-\u0652]/g, "");

            let kataUserArray = teksBersihSuara.split(' ');
            let kataTargetArray = ayatTarget.teksAsli.split(' ');
            let jumlahKataCocok = 0;

            kataUserArray.slice(-6).forEach(kata => {
                if(kataTargetArray.includes(kata)) jumlahKataCocok++;
            });

            let rasioKecocokan = jumlahKataCocok / kataTargetArray.length;

            const targetEl = document.getElementById(`target-arab-${ayatTarget.nomor}`);
            const svgBox = document.querySelector(`#frame-box-${ayatTarget.nomor} .mushaf-frame-svg`);

            // JIKA SELESAI DIBACA (HIJAU / ORANYE)
            if (rasioKecocokan >= 0.50) { 
                targetEl.className = "status-correct inline";
                warnaiBingkaiSVG(svgBox, "#10b981");
                eksekusiFadeOutAyat(targetEl);
                return;
            } 
            
            if (rasioKecocokan >= 0.25 && rasioKecocokan < 0.50) {
                targetEl.className = "status-warning inline";
                warnaiBingkaiSVG(svgBox, "#f97316");
                eksekusiFadeOutAyat(targetEl);
                return;
            }

            // CEK APAKAH USER LOMPAT KE 1 AYAT DI DEPANNYA
            if(indexAyatFokusTracker + 1 < dataAyatSurahAktif.length) {
                let nextAyatTarget = dataAyatSurahAktif[indexAyatFokusTracker + 1];
                let kataNextTargetArray = nextAyatTarget.teksAsli.split(' ');
                let cocokDiAyatNext = 0;

                kataUserArray.slice(-5).forEach(kata => {
                    if(kataNextTargetArray.includes(kata)) cocokDiAyatNext++;
                });

                if (cocokDiAyatNext >= 2 || (cocokDiAyatNext / kataNextTargetArray.length) > 0.35) {
                    targetEl.className = "status-wrong inline";
                    warnaiBingkaiSVG(svgBox, "#ef4444");
                    eksekusiFadeOutAyat(targetEl);
                }
            }
        }

        function warnaiBingkaiSVG(el, warnaHex) {
            if(!el) return;
            el.setAttribute('data-colored', 'true');
            el.style.stroke = warnaHex;
            el.style.strokeWidth = "2.5";
        }

        // Fungsi Inti untuk Menghilangkan Ayat setelah Selesai Dibaca
        function eksekusiFadeOutAyat(elemenAyat) {
            timestampEvaluasiTerakhir = Date.now();
            
            if(speechEngine) speechEngine.stop();
            setTimeout(() => { if(isEngineMendengar && speechEngine) speechEngine.start(); }, 50);

            // Beri jeda 1.2 detik agar user sempat melihat konfirmasi warna (Hijau/Oranye), lalu buat teksnya memudar hilang total!
            setTimeout(() => {
                elemenAyat.className = "status-done inline";
                majuKeAyatBerikutnya();
            }, 1200);
        }

        function majuKeAyatBerikutnya() {
            indexAyatFokusTracker++;
            if(indexAyatFokusTracker < dataAyatSurahAktif.length) {
                bukaKunciAyatAktif(dataAyatSurahAktif[indexAyatFokusTracker].nomor);
            } else {
                alert("Masyallah, hafalan surah selesai dipetakan penuh!");
                if(speechEngine) speechEngine.stop();
            }
        }
    </script>
</body>
</html>
