<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarteel AI Pro - 3 Modes & Post-Evaluation System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- FONT ARAB SEDERHANA (TARTEEL / QURAN NU STYLE) --- */
        .font-quran-modern { 
            font-family: 'Noto Sans Arabic', system-ui, -apple-system, sans-serif; 
            font-size: 2.2rem; 
            line-height: 5.5rem; 
            word-spacing: 4px;
        }
        .font-sans-custom { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* --- TARTEEL 3 MODES STATES --- */
        .state-standby { display: none !important; }
        .state-focus { display: inline !important; color: #64748b !important; opacity: 0.3; filter: blur(0px); }
        .state-hidden { display: inline !important; color: transparent !important; background: #334155; border-radius: 6px; padding: 0 15px; user-select: none; }
        .state-correct { display: inline !important; color: #10b981 !important; opacity: 1 !important; font-weight: 700; background: transparent; } 
        .state-done { display: inline !important; color: #94a3b8 !important; opacity: 0.9 !important; background: transparent; }

        /* --- BINGKAI ORNAMEN --- */
        .mushaf-frame-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 38px;         
            height: 38px;
            margin: 0 10px;      
            vertical-align: middle;
            transform: translateY(-2px);
        }
        .mushaf-frame-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            fill: none;
            stroke: #475569;
            stroke-width: 1.5;
        }
        .mushaf-frame-number {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: #64748b;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans-custom min-h-screen antialiased">

    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-xl">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 p-2 rounded-xl text-white shadow-lg">
                    <i class="fa-solid fa-microchip text-base"></i>
                </div>
                <div>
                    <span class="font-bold text-sm tracking-wide bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">TARTEEL ENGINE v2</span>
                    <p class="text-[9px] text-slate-500 font-mono tracking-wider">3-MODE INTERACTIVE MEMORIZATION</p>
                </div>
            </div>
            <div id="statusBadge" class="text-xs bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800 flex items-center gap-1.5 font-mono text-[9px] uppercase tracking-wider text-emerald-400">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                System Ready
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-4 space-y-4">
        
        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl space-y-4">
            <div>
                <span class="text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-2 font-mono">Pilih Mode Menghafal (Tarteel Style):</span>
                <div class="grid grid-cols-3 gap-2">
                    <button id="btnModeRead" onclick="gantiModeAplikasi('read')" class="bg-emerald-600 border border-emerald-500 text-white p-3 rounded-xl cursor-pointer text-left transition shadow-lg">
                        <div class="flex justify-between items-center"><span class="text-xs font-bold">1. Melihat Ayat</span><i class="fa-solid fa-eye text-xs"></i></div>
                        <p class="text-[9px] text-emerald-200 mt-0.5">Ayat terlihat samar di layar.</p>
                    </button>
                    <button id="btnModeHide" onclick="gantiModeAplikasi('hide')" class="bg-slate-950 border border-slate-800 text-slate-400 p-3 rounded-xl cursor-pointer text-left transition hover:bg-slate-800">
                        <div class="flex justify-between items-center"><span class="text-xs font-bold">2. Ayat Menghilang</span><i class="fa-solid fa-eye-slash text-xs"></i></div>
                        <p class="text-[9px] text-slate-500 mt-0.5">Ayat gaib, muncul saat dibaca benar.</p>
                    </button>
                    <button id="btnModeQuiz" onclick="gantiModeAplikasi('quiz')" class="bg-slate-950 border border-slate-800 text-slate-400 p-3 rounded-xl cursor-pointer text-left transition hover:bg-slate-800">
                        <div class="flex justify-between items-center"><span class="text-xs font-bold">3. Mode Quiz</span><i class="fa-solid fa-graduation-cap text-xs"></i></div>
                        <p class="text-[9px] text-slate-500 mt-0.5">Tebak letak & lafal ayat secara acak.</p>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-center border-t border-slate-800/60 pt-3">
                <div>
                    <label class="text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-1 font-mono">Pilih No Surah (1-114)</label>
                    <div class="flex gap-1.5">
                        <input type="number" id="inpLinkAyat" value="108" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-center font-bold font-mono text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                        <button onclick="loadSurahTarteel()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-4 rounded-xl text-xs transition cursor-pointer">Load</button>
                    </div>
                </div>

                <div class="text-center">
                    <span class="text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-1 font-mono">Kontrol Mikrofon</span>
                    <button id="btnTarteelVoice" onclick="toggleTarteelVoiceEngine()" class="w-full bg-slate-800 text-slate-200 py-2 rounded-xl text-xs font-bold border border-slate-700 cursor-pointer transition hover:bg-slate-700 flex justify-center items-center gap-2">
                        <i id="iconVoiceEngine" class="fa-solid fa-microphone text-emerald-400"></i> <span id="txtVoiceEngine">Mulai Rekam Suara</span>
                    </button>
                </div>

                <div id="quizPromptBox" class="bg-amber-950/20 border border-amber-900/40 p-2.5 rounded-xl hidden text-left">
                    <span class="text-[9px] font-bold uppercase tracking-wider text-amber-400 font-mono block"><i class="fa-solid fa-circle-question animate-pulse"></i> Tantangan Quiz:</span>
                    <p id="txtQuizPrompt" class="text-xs font-bold text-slate-300 mt-0.5">Muat mode quiz untuk memulai tebakan.</p>
                </div>
            </div>
        </div>

        <div id="monitorSuaraBox" class="hidden bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
            <span class="text-[9px] uppercase font-mono tracking-wider text-emerald-400 font-bold"><i class="fa-solid fa-wave-square mr-1 animate-pulse"></i> Live Text:</span>
            <p id="txtLiveAudioSpeech" class="font-quran-modern text-right text-sm text-amber-200/90 truncate max-w-xl" dir="rtl">Mendengarkan ucapan lafal...</p>
        </div>

        <div class="bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl overflow-hidden">
            <div class="p-4 bg-slate-900 border-b border-slate-800 text-center">
                <h2 id="txtNamaSurah" class="font-bold text-xs uppercase tracking-widest text-slate-400 font-mono">Al-Kautsar</h2>
            </div>
            <div id="mushafAreaContainer" class="p-8 md:p-12 min-h-[35vh] max-h-[60vh] overflow-y-auto text-right select-none" dir="rtl">
                <div id="mushafParagraphContent" class="font-quran-modern text-justify whitespace-normal tracking-wide"></div>
            </div>
        </div>

        <div id="panelRaporAkhir" class="bg-slate-900 border border-slate-800 p-5 rounded-2xl hidden space-y-3 shadow-2xl transition-all">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-[10px] uppercase font-mono tracking-wider font-bold text-amber-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-square-poll-vertical text-sm"></i> Rapor Hasil Koreksi Hafalan Anda
                </span>
                <button onclick="tutupPanelRapor()" class="text-slate-500 hover:text-slate-300 font-mono text-[10px] uppercase cursor-pointer">Tutup [x]</button>
            </div>
            <div id="kontenRaporEror" class="space-y-2">
                </div>
        </div>
    </main>

    <script>
        // --- DATABASE SEED SAMA SEPERTI SEBELUMNYA ---
        const localSurahDatabase = {
            1: {
                name: "الفاتحة", englishName: "Al-Fatihah",
                ayahs: [
                    { numberInSurah: 1, text: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", arti: "Dengan nama Allah Yang Maha Pengasih, Maha Penyayang." },
                    { numberInSurah: 2, text: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", arti: "Segala puji bagi Allah, Tuhan seluruh alam." },
                    { numberInSurah: 3, text: "الرَّحْمَٰنِ الرَّحِيمِ", arti: "Yang Maha Pengasih, Maha Penyayang." },
                    { numberInSurah: 4, text: "مَالِكِ يَوْمِ الدِّينِ", arti: "Pemilik hari pembalasan." },
                    { numberInSurah: 5, text: "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ", arti: "Hanya kepada-Mulah kami menyembah dan hanya kepada-Mulah kami memohon pertolongan." },
                    { numberInSurah: 6, text: "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ", arti: "Tunjukilah kami jalan yang lurus." },
                    { numberInSurah: 7, text: "صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ", arti: "jalan orang-orang yang telah Engkau beri nikmat." }
                ]
            },
            108: {
                name: "الكوثر", englishName: "Al-Kautsar",
                ayahs: [
                    { numberInSurah: 1, text: "إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ", arti: "Sungguh, Kami telah memberimu nikmat yang banyak." },
                    { numberInSurah: 2, text: "فَصَلِّ لِرَبِّكَ وَانْحَرْ", arti: "Maka laksanakanlah salat karena Tuhanmu, dan berkurbanlah!" },
                    { numberInSurah: 3, text: "إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ", arti: "Sungguh, orang-orang yang membencimu dialah yang terputus." }
                ]
            },
            112: {
                name: "الإخلاص", englishName: "Al-Ikhlas",
                ayahs: [
                    { numberInSurah: 1, text: "قُلْ هُوَ اللَّهُ أَحَدٌ", arti: "Katakanlah (Muhammad), Dia-lah Allah, Yang Maha Esa." },
                    { numberInSurah: 2, text: "اللَّهُ الصَّمَدُ", arti: "Allah tempat meminta segala sesuatu." },
                    { numberInSurah: 3, text: "لَمْ يَلِدْ وَلَمْ يُولَدْ", arti: "Allah tidak beranak dan tidak pula diperanakkan." },
                    { numberInSurah: 4, text: "وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ", arti: "Dan tidak ada sesuatu yang setara dengan Dia." }
                ]
            }
        };

        const ornamenVektorBukuHTML = `
            <svg class="mushaf-frame-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="30" stroke="#475569" stroke-width="2" fill="none"/>
                <circle cx="50" cy="50" r="25" stroke="#475569" stroke-width="1" stroke-dasharray="2,2" fill="none"/>
                <path d="M 50,18 C 45,18 41,13 50,2 C 59,13 55,18 50,18 Z" stroke="#475569" stroke-width="1.5" fill="none"/>
                <path d="M 50,82 C 45,82 41,87 50,98 C 59,87 55,82 50,82 Z" stroke="#475569" stroke-width="1.5" fill="none"/>
            </svg>
        `;

        let dataAyatSurahAktif = [];
        let speechEngine;
        let isEngineMendengar = false;
        let indexAyatFokusTracker = 0;
        let modeAktifApp = "read"; // read, hide, quiz
        let targetQuizAyatSaja = null;
        
        // REKOR LOG KESALAHAN UNTUK DIEVALUASI DI AKHIR SESI
        let tampunganErorSesiIni = [];

        window.onload = () => { loadSurahTarteel(); };

        function gantiModeAplikasi(modeBaru) {
            modeAktifApp = modeBaru;
            
            // Atur Visual Button State
            ["Read", "Hide", "Quiz"].forEach(m => {
                const b = document.getElementById(`btnMode${m}`);
                b.className = "bg-slate-950 border border-slate-800 text-slate-400 p-3 rounded-xl cursor-pointer text-left transition hover:bg-slate-800";
            });
            const namaIdKapital = modeBaru.charAt(0).toUpperCase() + modeBaru.slice(1);
            document.getElementById(`btnMode${namaIdKapital}`).className = "bg-emerald-600 border border-emerald-500 text-white p-3 rounded-xl cursor-pointer text-left transition shadow-lg";

            document.getElementById('quizPromptBox').classList.add('hidden');
            document.getElementById('panelRaporAkhir').classList.add('hidden');
            
            if(speechEngine) speechEngine.stop();
            refreshRenderingTampilanAyat();
        }

        function loadSurahTarteel() {
            let surahNum = parseInt(document.getElementById('inpLinkAyat').value.trim()) || 108;
            let dataTerpilih = localSurahDatabase[surahNum] || localSurahDatabase[108]; // fallback ke Al-Kautsar

            document.getElementById('txtNamaSurah').innerText = dataTerpilih.englishName;
            dataAyatSurahAktif = [];
            tampunganErorSesiIni = [];
            indexAyatFokusTracker = 0;
            document.getElementById('panelRaporAkhir').classList.add('hidden');

            dataTerpilih.ayahs.forEach((ayah) => {
                dataAyatSurahAktif.push({
                    nomor: ayah.numberInSurah,
                    teksAsli: ayah.text.replace(/[\u064B-\u0652]/g, "").trim(), // Bersihkan harakat untuk AI engine
                    teksTampil: ayah.text,
                    artiIndo: ayah.arti
                });
            });

            refreshRenderingTampilanAyat();
        }

        function refreshRenderingTampilanAyat() {
            const container = document.getElementById('mushafParagraphContent');
            container.innerHTML = "";
            let htmlBuilder = "";

            if(modeAktifApp === "quiz") {
                // Ambil acak satu ayat untuk dijadikan soal Quiz
                let acakIndex = Math.floor(Math.random() * dataAyatSurahAktif.length);
                targetQuizAyatSaja = dataAyatSurahAktif[acakIndex];
                
                document.getElementById('quizPromptBox').classList.remove('hidden');
                document.getElementById('txtQuizPrompt').innerText = `Tebak lafal ayat ke-${targetQuizAyatSaja.nomor} dari surah ini!`;

                dataAyatSurahAktif.forEach(ayah => {
                    let isTargetQuiz = (ayah.nomor === targetQuizAyatSaja.nomor);
                    htmlBuilder += `
                        <span id="target-arab-${ayah.nomor}" class="${isTargetQuiz ? 'state-hidden' : 'state-done'} inline">${ayah.teksTampil}</span>
                        <span class="mushaf-frame-container">${ornamenVektorBukuHTML}<span class="mushaf-frame-number">${ayah.nomor}</span></span>
                    `;
                });
            } else {
                // Mode Biasa: Melihat atau Menghilang
                dataAyatSurahAktif.forEach((ayah, i) => {
                    let classAwal = (i === 0) ? (modeAktifApp === "hide" ? "state-hidden" : "state-focus") : "state-standby";
                    htmlBuilder += `
                        <span id="target-arab-${ayah.nomor}" class="${classAwal} inline">${ayah.teksTampil}</span>
                        <span class="mushaf-frame-container">${ornamenVektorBukuHTML}<span class="mushaf-frame-number">${ayah.nomor}</span></span>
                    `;
                });
            }

            container.innerHTML = htmlBuilder;
        }

        function toggleTarteelVoiceEngine() {
            if (!speechEngine) {
                const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
                speechEngine = new SpeechClass();
                speechEngine.lang = 'ar-SA';
                speechEngine.continuous = true;
                speechEngine.interimResults = true;

                speechEngine.onstart = () => {
                    isEngineMendengar = true;
                    document.getElementById('btnTarteelVoice').className = "w-full bg-red-600 text-white py-2 rounded-xl text-xs font-bold border border-red-500 animate-pulse cursor-pointer";
                    document.getElementById('txtVoiceEngine').innerText = "Hentikan Perekaman";
                    document.getElementById('monitorSuaraBox').classList.remove('hidden');
                };

                speechEngine.onend = () => {
                    isEngineMendengar = false;
                    document.getElementById('btnTarteelVoice').className = "w-full bg-slate-800 text-slate-200 py-2 rounded-xl text-xs font-bold border border-slate-700 cursor-pointer";
                    document.getElementById('txtVoiceEngine').innerText = "Mulai Rekam Suara";
                    document.getElementById('monitorSuaraBox').classList.add('hidden');
                    
                    // KETIKA MIC DIHENTIKAN: Tampilkan Semua Hasil Rapor Eror di Sini!
                    evaluasiRaporAkhirSesi();
                };

                speechEngine.onresult = (event) => {
                    let textResult = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        textResult += event.results[i][0].transcript;
                    }
                    document.getElementById('txtLiveAudioSpeech').innerText = textResult;
                    if(textResult.trim() !== "") prosessorAnalisisRealtimeAI(textResult.trim());
                };
            }

            if(isEngineMendengar) speechEngine.stop(); else speechEngine.start();
        }

        // --- CORE EVALUATION LOGIC (KOREKSI DI AKHIR) ---
        function prosessorAnalisisRealtimeAI(suaraInput) {
            let ayatTarget = (modeAktifApp === "quiz") ? targetQuizAyatSaja : dataAyatSurahAktif[indexAyatFokusTracker];
            if(!ayatTarget) return;

            let teksUserClean = suaraInput.trim().replace(/[\u064B-\u0652]/g, "");
            let kataUserArr = teksUserClean.split(' ');
            let kataTargetArr = ayatTarget.teksAsli.split(' ');

            let cocok = 0;
            kataUserArr.slice(-6).forEach(k => { if(kataTargetArr.includes(k)) cocok++; });
            let rasioAkurasi = cocok / kataTargetArr.length;

            const targetEl = document.getElementById(`target-arab-${ayatTarget.nomor}`);

            // 1. JIKA JAWABAN BENAR / COCOK
            if (rasioAkurasi >= 0.60) {
                targetEl.className = "state-correct inline";
                
                if(modeAktifApp === "quiz") {
                    alert("Masya Allah! Jawaban Anda dalam Mode Quiz Benar Sempurna!");
                    speechEngine.stop();
                    return;
                }

                // Maju ke ayat berikutnya (Untuk Mode 1 dan Mode 2)
                indexAyatFokusTracker++;
                if(indexAyatFokusTracker < dataAyatSurahAktif.length) {
                    let ayatSelanjutnya = dataAyatSurahAktif[indexAyatFokusTracker];
                    const nextEl = document.getElementById(`target-arab-${ayatSelanjutnya.nomor}`);
                    if(nextEl) {
                        nextEl.className = (modeAktifApp === "hide") ? "state-hidden" : "state-focus";
                    }
                } else {
                    alert("Alhamdulillah, Anda telah menyelesaikan seluruh surah!");
                    speechEngine.stop();
                }
            } 
            // 2. JIKA SALAH, SIMPAN ERROR UNTUK DIHITUNG MERAH DI AKHIR SESI
            else {
                if(teksUserClean.length > 4) {
                    // Cek kriteria eror secara pasif tanpa menghentikan layar
                    let temuanErorKata = false;
                    kataTargetArr.forEach(tWord => {
                        if(!teksUserClean.includes(tWord)) temuanErorKata = true;
                    });

                    let tipeEror = "Eror Karakter (Huruf Tertinggal/Tertukar)";
                    let adaIkhfa = /[\u064B\u064C\u064D\u0652][\u062A\u062B\u062C\u062D\u062E\u062F\u0630\u0631\u0632\u0633\u0634\u0635\u0636\u0637\u0638\u0641\u0652\u0642\u064A]/.test(ayatTarget.teksTampil);
                    
                    if(adaIkhfa && rasioAkurasi < 0.50) {
                        tipeEror = "Kesalahan Hukum Tajwid (Ikhfa/Iqlab/Idgham)";
                    }
                    if(rasioAkurasi < 0.35) {
                        tipeEror = "Perubahan Arti & Makna Semantik";
                    }

                    // Masukkan ke dalam log jika belum tercatat untuk ayat ini
                    let sudahAda = tampunganErorSesiIni.some(e => e.noAyat === ayatTarget.nomor && e.jenis === tipeEror);
                    if(!sudahAda && temuanErorKata) {
                        tampunganErorSesiIni.push({
                            noAyat: ayatTarget.nomor,
                            jenis: tipeEror,
                            artiTerancam: ayatTarget.artiIndo
                        });
                    }
                }
            }
        }

        // --- PROSES TAMPILAN RAPOR AKHIR ---
        function evaluasiRaporAkhirSesi() {
            const panelRapor = document.getElementById('panelRaporAkhir');
            const kontenRapor = document.getElementById('kontenRaporEror');
            
            panelRapor.classList.remove('hidden');
            panelRapor.scrollIntoView({ behavior: 'smooth' });

            if(tampunganErorSesiIni.length === 0) {
                kontenRapor.innerHTML = `
                    <div class="p-3 bg-emerald-950/40 border border-emerald-900 rounded-xl text-center text-emerald-400 text-xs font-mono">
                        🎉 Sempurna! Tidak ditemukan kesalahan huruf tertinggal, tajwid, maupun perubahan arti dalam hafalan sesi ini.
                    </div>
                `;
            } else {
                let htmlLog = "";
                tampunganErorSesiIni.forEach((eror, index) => {
                    let badgeWarna = "text-red-400 border-red-950 bg-red-950/20";
                    if(eror.jenis.includes("Tajwid")) badgeWarna = "text-amber-400 border-amber-950 bg-amber-950/20";
                    
                    htmlLog += `
                        <div class="p-3 border rounded-xl text-xs space-y-1 ${badgeWarna}">
                            <div class="flex justify-between font-mono font-bold">
                                <span>[${index + 1}] Ayat ${eror.noAyat} - ${eror.jenis}</span>
                                <span class="text-[10px] uppercase">Hitung Merah ❌</span>
                            </div>
                            <p class="text-[11px] text-slate-300 font-sans">
                                <span class="font-bold text-slate-100">Dampak Arti Indonesia:</span> "${eror.artiTerancam}"
                            </p>
                        </div>
                    `;
                });
                kontenRapor.innerHTML = htmlLog;
            }
        }

        function tutupPanelRapor() {
            document.getElementById('panelRaporAkhir').classList.add('hidden');
        }
    </script>
