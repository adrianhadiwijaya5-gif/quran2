<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarteel AI Pro v3 - Continuous Mushaf Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- FONT UTAMA QURAN DIGITAL --- */
        .font-quran-standard { 
            font-family: 'Noto Sans Arabic', system-ui, sans-serif; 
            font-size: 2.1rem; 
            line-height: 5.2rem; 
            word-spacing: 3px;
        }
        .font-sans-custom { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* --- TARTEEL STATES --- */
        .state-standby { color: #475569; opacity: 0.25; }
        .state-focus { color: #94a3b8; opacity: 0.5; background: rgba(51, 65, 85, 0.2); border-radius: 8px; }
        .state-hidden { color: transparent !important; background: #334155; border-radius: 6px; padding: 0 10px; user-select: none; }
        .state-correct { color: #10b981 !important; opacity: 1 !important; font-weight: 700; background: transparent; } 
        .state-done { color: #cbd5e1 !important; opacity: 0.95 !important; background: transparent; }

        /* --- FRAME NOMOR AYAT GEOMETRIS (Sesuai Gambar Acuan) --- */
        .quran-ayah-frame {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 42px;         
            height: 42px;
            margin: 0 12px;      
            vertical-align: middle;
        }
        .quran-frame-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            fill: none;
            stroke: #334155;
            stroke-width: 1.2;
        }

        /* --- SCROLLBAR STYLE FOR MUSHAF PANEL --- */
        .mushaf-scroll::-webkit-scrollbar { width: 6px; }
        .mushaf-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .mushaf-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans-custom min-h-screen antialiased">

    <nav class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-50 shadow-xl">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-br from-emerald-600 to-teal-700 p-2 rounded-xl text-white shadow-md">
                    <i class="fa-solid fa-book-quran text-base"></i>
                </div>
                <div>
                    <span class="font-bold text-sm tracking-wide bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">TARTEEL CORE v3.0</span>
                    <p class="text-[9px] text-slate-500 font-mono tracking-wider">CONTINUOUS VERTICAL MUSHAF SYSTEM</p>
                </div>
            </div>
            <div id="statusBadge" class="text-[9px] bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800 flex items-center gap-1.5 font-mono uppercase tracking-wider text-emerald-400">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                Database Connected
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-4 space-y-4">
        
        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl space-y-4">
            <div>
                <span class="text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-2 font-mono">Mode Menghafal Interaktif:</span>
                <div class="grid grid-cols-3 gap-2">
                    <button id="btnModeRead" onclick="gantiModeAplikasi('read')" class="bg-emerald-600 border border-emerald-500 text-white p-3 rounded-xl cursor-pointer text-left transition shadow-lg">
                        <div class="flex justify-between items-center"><span class="text-xs font-bold">1. Melihat Ayat</span><i class="fa-solid fa-eye text-xs"></i></div>
                        <p class="text-[9px] text-emerald-200 mt-0.5">Ayat samar, fokus melafalkan tulisan.</p>
                    </button>
                    <button id="btnModeHide" onclick="gantiModeAplikasi('hide')" class="bg-slate-950 border border-slate-800 text-slate-400 p-3 rounded-xl cursor-pointer text-left transition hover:bg-slate-800">
                        <div class="flex justify-between items-center"><span class="text-xs font-bold">2. Ayat Menghilang</span><i class="fa-solid fa-eye-slash text-xs"></i></div>
                        <p class="text-[9px] text-slate-500 mt-0.5">Layar tertutup, terbuka bertahap jika benar.</p>
                    </button>
                    <button id="btnModeQuiz" onclick="gantiModeAplikasi('quiz')" class="bg-slate-950 border border-slate-800 text-slate-400 p-3 rounded-xl cursor-pointer text-left transition hover:bg-slate-800">
                        <div class="flex justify-between items-center"><span class="text-xs font-bold">3. Mode Quiz</span><i class="fa-solid fa-graduation-cap text-xs"></i></div>
                        <p class="text-[9px] text-slate-500 mt-0.5">AI memilih satu ayat acak untuk ditebak.</p>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-center border-t border-slate-800/60 pt-3">
                <div>
                    <label class="text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-1 font-mono">Lompat Ke No Surah (1-114)</label>
                    <div class="flex gap-1.5">
                        <input type="number" id="inpLinkAyat" value="108" min="1" max="114" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-center font-bold font-mono text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                        <button onclick="loadSurahTarteel()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-4 rounded-xl text-xs transition cursor-pointer">Load</button>
                    </div>
                </div>

                <div class="text-center">
                    <span class="text-[9px] font-bold uppercase tracking-wider text-slate-500 block mb-1 font-mono">Kontrol Mikrofon</span>
                    <button id="btnTarteelVoice" onclick="toggleTarteelVoiceEngine()" class="w-full bg-slate-800 text-slate-200 py-2 rounded-xl text-xs font-bold border border-slate-700 cursor-pointer transition hover:bg-slate-700 flex justify-center items-center gap-2">
                        <i id="iconVoiceEngine" class="fa-solid fa-microphone text-emerald-400"></i> <span id="txtVoiceEngine">Mulai Rekam Suara</span>
                    </button>
                </div>

                <div id="quizPromptBox" class="bg-amber-950/20 border border-amber-900/40 p-2.5 rounded-xl hidden text-left">
                    <span class="text-[9px] font-bold uppercase tracking-wider text-amber-400 font-mono block"><i class="fa-solid fa-circle-question animate-pulse"></i> Tantangan Quiz:</span>
                    <p id="txtQuizPrompt" class="text-xs font-bold text-slate-300 mt-0.5">Memilih target ayat...</p>
                </div>
            </div>
        </div>

        <div id="monitorSuaraBox" class="hidden bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between animate-fade-in">
            <span class="text-[9px] uppercase font-mono tracking-wider text-emerald-400 font-bold"><i class="fa-solid fa-wave-square mr-1 animate-pulse"></i> Realtime Audio Capture:</span>
            <p id="txtLiveAudioSpeech" class="font-quran-standard text-right text-sm text-amber-200/90 truncate max-w-xl" dir="rtl">Menangkap suara hafalan...</p>
        </div>

        <div class="bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl overflow-hidden flex flex-col">
            <div class="p-3 bg-slate-950/40 border-b border-slate-800 flex justify-between items-center px-6">
                <div class="flex items-center gap-2 text-[10px] font-mono text-slate-400 uppercase tracking-widest">
                    <i class="fa-solid fa-layer-group text-slate-600"></i> VIEW MODE: CONTINUOUS SCROLL
                </div>
                <div id="indicatorPenandaSpesial" class="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded font-mono hidden">
                    ---
                </div>
            </div>
            
            <div id="mushafAreaContainer" class="p-6 md:p-10 h-[60vh] overflow-y-auto text-right select-none mushaf-scroll bg-slate-900/40" dir="rtl">
                <div id="mushafParagraphContent" class="font-quran-standard text-justify leading-[5.5rem] tracking-wide whitespace-normal">
                    </div>
            </div>
        </div>

        <div id="panelRaporAkhir" class="bg-slate-900 border border-slate-800 p-5 rounded-2xl hidden space-y-3 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-[10px] uppercase font-mono tracking-wider font-bold text-amber-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-square-poll-vertical text-sm"></i> LOG EVALUASI DI AKHIR SESI MEMORISASI
                </span>
                <button onclick="tutupPanelRapor()" class="text-slate-500 hover:text-slate-300 font-mono text-[10px] uppercase cursor-pointer">Tutup [x]</button>
            </div>
            <div id="kontenRaporEror" class="space-y-2"></div>
        </div>
    </main>

    <script>
        // --- APPARATUS FRAME & ORNAMEN HEADER (BERDASARKAN GAMBAR SVG ACUAN) ---
        const frameNomorAyatMelingkarSVG = `
            <svg class="quran-frame-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="38" stroke="#334155" stroke-width="1.5" fill="none"/>
                <circle cx="50" cy="50" r="32" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
                <circle cx="50" cy="8" r="2" fill="#475569"/>
                <circle cx="50" cy="92" r="2" fill="#475569"/>
            </svg>
        `;

        function buatOrnamenHeaderSurahHTML(namaInggris, namaArab, totalAyat) {
            return `
                <div class="w-full my-8 block text-center select-none" dir="ltr">
                    <div class="inline-block relative w-full max-w-lg p-4 rounded-2xl border border-slate-800 bg-gradient-to-b from-slate-950 to-slate-900 overflow-hidden shadow-xl">
                        <div class="absolute inset-0 opacity-5 pointer-events-none flex justify-between items-center px-4">
                            <i class="fa-solid fa-mosque text-5xl"></i>
                            <i class="fa-solid fa-kaaba text-5xl"></i>
                        </div>
                        <span class="text-[9px] font-mono tracking-widest text-emerald-400 uppercase font-bold block mb-1">سُورَةُ</span>
                        <h2 class="text-2xl font-bold font-sans text-slate-100 tracking-wide">${namaInggris}</h2>
                        <p class="text-lg font-quran-standard text-slate-400 my-1" dir="rtl">${namaArab}</p>
                        <div class="text-[9px] font-mono text-slate-500 mt-2 tracking-wider uppercase border-t border-slate-800/60 pt-2">
                            Makkah/Madinah • ${totalAyat} Ayat
                        </div>
                    </div>
                    <div class="w-full text-center my-6 block font-quran-standard text-emerald-500/90 tracking-widest text-2xl" dir="rtl">
                        بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
                    </div>
                </div>
            `;
        }

        let dataAyatSurahAktif = [];
        let speechEngine;
        let isEngineMendengar = false;
        let indexAyatFokusTracker = 0;
        let modeAktifApp = "read"; 
        let targetQuizAyatSaja = null;
        let tampunganErorSesiIni = [];

        window.onload = () => { loadSurahTarteel(); };

        function gantiModeAplikasi(modeBaru) {
            modeAktifApp = modeBaru;
            ["Read", "Hide", "Quiz"].forEach(m => {
                const b = document.getElementById(`btnMode${m}`);
                b.className = "bg-slate-950 border border-slate-800 text-slate-400 p-3 rounded-xl cursor-pointer text-left transition hover:bg-slate-800";
            });
            const namaIdKapital = modeBaru.charAt(0).toUpperCase() + modeBaru.slice(1);
            document.getElementById(`btnMode${namaIdKapital}`).className = "bg-emerald-600 border border-emerald-500 text-white p-3 rounded-xl cursor-pointer text-left transition shadow-lg";

            document.getElementById('quizPromptBox').classList.add('hidden');
            document.getElementById('panelRaporAkhir').classList.add('hidden');
            
            if(speechEngine) speechEngine.stop();
            refreshRenderingTampilanAyat();
        }

        // --- ENGINE UNTUK MENGALIRKAN TEKS KE BAWAH (VERTICAL CONTINUOUS MUSHAF) ---
        async function loadSurahTarteel() {
            let surahNum = parseInt(document.getElementById('inpLinkAyat').value.trim()) || 108;
            if(surahNum < 1 || surahNum > 114) return alert("Pilih nomor di antara 1 - 114!");

            const container = document.getElementById('mushafParagraphContent');
            container.innerHTML = `
                <div class="text-center py-16 w-full block" dir="ltr">
                    <i class="fa-solid fa-circle-notch animate-spin text-emerald-500 text-3xl mb-3"></i>
                    <p class="text-xs text-slate-500 font-mono tracking-widest">PROSES RETRIEVAL DATA MUSHAF DIGITAL...</p>
                </div>
            `;
            
            dataAyatSurahAktif = [];
            tampunganErorSesiIni = [];
            indexAyatFokusTracker = 0;
            document.getElementById('panelRaporAkhir').classList.add('hidden');

            try {
                const resText = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/editions/quran-simple`);
                const jsonText = await resText.json();
                
                const resTrans = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/editions/id.indonesian`);
                const jsonTrans = await resTrans.json();

                if (jsonText.code === 200 && jsonTrans.code === 200) {
                    let metadataSurah = jsonText.data[0];
                    let ayahsText = metadataSurah.ayahs;
                    let ayahsTrans = jsonTrans.data[0].ayahs;

                    // Simpan Identitas Global Surah Aktif
                    document.getElementById('indicatorPenandaSpesial').innerText = `Surah: ${metadataSurah.englishName}`;
                    document.getElementById('indicatorPenandaSpesial').classList.remove('hidden');

                    ayahsText.forEach((ayah, index) => {
                        let rawText = ayah.text;
                        
                        // Pembersihan Bismillah bawaan API agar tidak merusak alur verifikasi suara mic
                        if(ayah.numberInSurah === 1 && surahNum !== 1 && surahNum !== 9 && rawText.startsWith("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ")) {
                            rawText = rawText.replace("بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ", "");
                        }

                        // FITUR FLAG DATA DETEKSI MANUAL (Sajdah, Saktah, Hizb)
                        let penandaSpesial = null;
                        if(ayah.juz && ayah.numberInSurah === 1) penandaSpesial = `JUZ ${ayah.juz}`;
                        if(surahNum === 18 && ayah.numberInSurah === 1) penandaSpesial = "SAKTAH WAJIB";
                        if(rawText.includes("سَجَدَ") || rawText.includes("سُجَّدًا")) penandaSpesial = "AYAT SAJDAH";

                        dataAyatSurahAktif.push({
                            nomor: ayah.numberInSurah,
                            namaSurahInggris: metadataSurah.englishName,
                            namaSurahArab: metadataSurah.name,
                            totalAyatGlobal: ayahsText.length,
                            teksAsli: rawText.replace(/[\u064B-\u0652]/g, "").trim(), 
                            teksTampil: rawText,
                            artiIndo: ayahsTrans[index] ? ayahsTrans[index].text : "Terjemahan Kemenag RI.",
                            fiturKhusus: penandaSpesial
                        });
                    });

                    if(isEngineMendengar && speechEngine) speechEngine.stop();
                    refreshRenderingTampilanAyat();
                } else {
                    throw new Error("API Data Response Bermasalah");
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="text-center py-12 text-red-400 text-xs font-mono" dir="ltr">⚠️ Kegagalan Sinkronisasi API Cloud. Tekan tombol Load kembali.</div>`;
            }
        }

        function refreshRenderingTampilanAyat() {
            const container = document.getElementById('mushafParagraphContent');
            if(dataAyatSurahAktif.length === 0) return;
            
            container.innerHTML = "";
            let htmlBuilder = "";

            // 1. Suntikkan Pembatas Header Surah Utama di paling atas
            let metaInfo = dataAyatSurahAktif[0];
            htmlBuilder += buatOrnamenHeaderSurahHTML(metaInfo.namaSurahInggris, metaInfo.namaSurahArab, metaInfo.totalAyatGlobal);

            // 2. Alirkan Teks Kebawah (Continuous Paragraph Flow)
            if(modeAktifApp === "quiz") {
                let acakIndex = Math.floor(Math.random() * dataAyatSurahAktif.length);
                targetQuizAyatSaja = dataAyatSurahAktif[acakIndex];
                
                document.getElementById('quizPromptBox').classList.remove('hidden');
                document.getElementById('txtQuizPrompt').innerText = `Dengar & tebak bunyi lafal teks ayat ke-${targetQuizAyatSaja.nomor}!`;

                dataAyatSurahAktif.forEach(ayah => {
                    let isTargetQuiz = (ayah.nomor === targetQuizAyatSaja.nomor);
                    let badgeLabelSpesial = ayah.fiturKhusus ? `<span class="bg-amber-600/30 text-amber-300 font-mono text-[9px] px-1.5 py-0.5 rounded mx-1">${ayah.fiturKhusus}</span>` : "";

                    htmlBuilder += `
                        <span id="target-arab-${ayah.nomor}" class="${isTargetQuiz ? 'state-hidden' : 'state-done'} inline">${ayah.teksTampil}</span>
                        ${badgeLabelSpesial}
                        <span class="quran-ayah-frame">${frameNomorAyatMelingkarSVG}<span class="absolute font-sans text-[10px] font-bold text-slate-400 z-10">${ayah.nomor}</span></span>
                    `;
                });
            } else {
                dataAyatSurahAktif.forEach((ayah, i) => {
                    let classAwal = (i === 0) ? (modeAktifApp === "hide" ? "state-hidden" : "state-focus") : "state-standby";
                    let badgeLabelSpesial = ayah.fiturKhusus ? `<span class="bg-indigo-600/30 text-indigo-300 font-mono text-[9px] px-1.5 py-0.5 rounded mx-1">${ayah.fiturKhusus}</span>` : "";

                    htmlBuilder += `
                        <span id="target-arab-${ayah.nomor}" class="${classAwal} inline">${ayah.teksTampil}</span>
                        ${badgeLabelSpesial}
                        <span class="quran-ayah-frame">${frameNomorAyatMelingkarSVG}<span class="absolute font-sans text-[10px] font-bold text-slate-400 z-10">${ayah.nomor}</span></span>
                    `;
                });
            }

            container.innerHTML += htmlBuilder;
        }

        // --- CONTROLLER MIKROFON & REKORING EVALUASI ---
        function toggleTarteelVoiceEngine() {
            if (dataAyatSurahAktif.length === 0) return alert("Muat data surah terlebih dahulu!");

            if (!speechEngine) {
                const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
                speechEngine = new SpeechClass();
                speechEngine.lang = 'ar-SA';
                speechEngine.continuous = true;
                speechEngine.interimResults = true;

                speechEngine.onstart = () => {
                    isEngineMendengar = true;
                    document.getElementById('btnTarteelVoice').className = "w-full bg-red-600 text-white py-2 rounded-xl text-xs font-bold border border-red-500 animate-pulse cursor-pointer";
                    document.getElementById('txtVoiceEngine').innerText = "Hentikan Perekaman";
                    document.getElementById('monitorSuaraBox').classList.remove('hidden');
                };

                speechEngine.onend = () => {
                    isEngineMendengar = false;
                    document.getElementById('btnTarteelVoice').className = "w-full bg-slate-800 text-slate-200 py-2 rounded-xl text-xs font-bold border border-slate-700 cursor-pointer";
                    document.getElementById('txtVoiceEngine').innerText = "Mulai Rekam Suara";
                    document.getElementById('monitorSuaraBox').classList.add('hidden');
                    evaluasiRaporAkhirSesi(); // Koreksi total ditampilkan otomatis di akhir
                };

                speechEngine.onresult = (event) => {
                    let textResult = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        textResult += event.results[i][0].transcript;
                    }
                    document.getElementById('txtLiveAudioSpeech').innerText = textResult;
                    if(textResult.trim() !== "") prosessorAnalisisRealtimeAI(textResult.trim());
                };
            }

            if(isEngineMendengar) speechEngine.stop(); else { resetSemuaWarnaTarteel(); indexAyatFokusTracker = 0; speechEngine.start(); }
        }

        function resetSemuaWarnaTarteel() {
            dataAyatSurahAktif.forEach(item => {
                const el = document.getElementById(`target-arab-${item.nomor}`);
                if(el) el.className = "state-standby inline";
            });
            document.getElementById('panelRaporAkhir').classList.add('hidden');
            refreshRenderingTampilanAyat();
        }

        function prosessorAnalisisRealtimeAI(suaraInput) {
            let ayatTarget = (modeAktifApp === "quiz") ? targetQuizAyatSaja : dataAyatSurahAktif[indexAyatFokusTracker];
            if(!ayatTarget) return;

            let teksUserClean = suaraInput.trim().replace(/[\u064B-\u0652]/g, "");
            let kataUserArr = teksUserClean.split(' ');
            let kataTargetArr = ayatTarget.teksAsli.split(' ');

            let cocok = 0;
            kataUserArr.slice(-6).forEach(k => { if(kataTargetArr.includes(k)) cocok++; });
            let rasioAkurasi = cocok / kataTargetArr.length;

            const targetEl = document.getElementById(`target-arab-${ayatTarget.nomor}`);

            if (rasioAkurasi >= 0.55) {
                targetEl.className = "state-correct inline";
                
                // Menggulung layar otomatis ke ayat fokus agar tetap di tengah view
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

                if(modeAktifApp === "quiz") {
                    alert("Masya Allah! Jawaban Tebakan Benar Sempurna!");
                    speechEngine.stop();
                    return;
                }

                indexAyatFokusTracker++;
                if(indexAyatFokusTracker < dataAyatSurahAktif.length) {
                    let ayatSelanjutnya = dataAyatSurahAktif[indexAyatFokusTracker];
                    const nextEl = document.getElementById(`target-arab-${ayatSelanjutnya.nomor}`);
                    if(nextEl) {
                        nextEl.className = (modeAktifApp === "hide") ? "state-hidden" : "state-focus";
                    }
                } else {
                    alert("Alhamdulillah, Anda telah menyelesaikan seluruh surah!");
                    speechEngine.stop();
                }
            } else {
                if(teksUserClean.length > 3) {
                    let temuanErorKata = false;
                    kataTargetArr.forEach(tWord => {
                        if(!teksUserClean.includes(tWord)) temuanErorKata = true;
                    });

                    let tipeEror = "Huruf Tertinggal / Tertukar Makro";
                    if(rasioAkurasi < 0.35) {
                        tipeEror = "Perubahan Arti & Struktur Semantik";
                    }

                    let sudahAda = tampunganErorSesiIni.some(e => e.noAyat === ayatTarget.nomor && e.jenis === tipeEror);
                    if(!sudahAda && temuanErorKata) {
                        tampunganErorSesiIni.push({
                            noAyat: ayatTarget.nomor,
                            jenis: tipeEror,
                            artiTerancam: ayatTarget.artiIndo
                        });
                    }
                }
            }
        }

        function evaluasiRaporAkhirSesi() {
            const panelRapor = document.getElementById('panelRaporAkhir');
            const kontenRapor = document.getElementById('kontenRaporEror');
            
            panelRapor.classList.remove('hidden');
            panelRapor.scrollIntoView({ behavior: 'smooth' });

            if(tampunganErorSesiIni.length === 0) {
                kontenRapor.innerHTML = `
                    <div class="p-3 bg-emerald-950/40 border border-emerald-900 rounded-xl text-center text-emerald-400 text-xs font-mono">
                        🎉 Sempurna! Sesi ini bersih tanpa terdeteksi kesalahan fatal/perubahan arti bahasa Indonesia.
                    </div>
                `;
            } else {
                let htmlLog = "";
                tampunganErorSesiIni.forEach((eror, index) => {
                    htmlLog += `
                        <div class="p-3 border border-red-950 bg-red-950/20 text-red-400 rounded-xl text-xs space-y-1">
                            <div class="flex justify-between font-mono font-bold">
                                <span>[Koreksi Akhir ${index + 1}] Ayat Ke-${eror.noAyat} - ${eror.jenis}</span>
                                <span class="text-[10px] uppercase">Hitung Merah ❌</span>
                            </div>
                            <p class="text-[11px] text-slate-300 font-sans">
                                <span class="font-bold text-slate-100">Dampak Terjemahan:</span> "${eror.artiTerancam}"
                            </p>
                        </div>
                    `;
                });
                kontenRapor.innerHTML = htmlLog;
            }
        }

        function tutupPanelRapor() {
            document.getElementById('panelRaporAkhir').classList.add('hidden');
        }
    </script>
</body>
</html>
